name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.4.3.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "${expected}" != "${{ inputs.tag }}" ]; then
            echo "Package version ${expected} does not match requested tag ${{ inputs.tag }}" >&2
            exit 1
          fi

      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run release:check
      - name: Publish package
        run: |
          name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --access public
